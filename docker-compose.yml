services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: tripmate
      POSTGRES_DB: tripmate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate -d tripmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env                      # GROQ_API_KEY, TAVILY_API_KEY, ... (never baked into the image)
    environment:
      DATABASE_URL: postgresql://tripmate:tripmate@db:5432/tripmate
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
